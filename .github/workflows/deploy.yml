name: Deploy lab index to GitHub Pages

# Placeholder site: an index of the tracked labs_hw/ HTML (handouts and tools),
# built by code/utils/build_lab_index.py. The full Astro site is parked in
# deploy-astro.yml (manual trigger only) until it's ready.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 code/utils/build_lab_index.py _site
      - name: Write CNAME for a custom domain (only if PUBLIC_CNAME is set)
        if: ${{ vars.PUBLIC_CNAME != '' }}
        run: echo "${{ vars.PUBLIC_CNAME }}" > _site/CNAME
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
