[project]
name = "AccountingDataAnalytics"
version = "0.1.0"
description = "Accounting Analytics Course Materials"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "canvasapi",
    "chainlit>=2.11.0",
    "click",
    "duckdb",
    "fastapi>=0.135.1",
    "google-genai",
    "lxml",
    "markdown",
    "matplotlib",
    "nbconvert",
    "notebook",
    "openpyxl",
    "pandas",
    "playwright",
    "plotly",
    "psycopg[binary]",
    "pydantic>=2.12.5",
    "pyedgar",
    "pygments",
    "pymdown-extensions",
    "pyodbc",
    "PyPDF2",
    "python-dotenv",
    "python-pptx",
    "rapidfuzz>=3.14.3",
    "regex>=2026.2.28",
    "requests",
    "reslib",
    "scikit-image",
    "scikit-learn",
    "seaborn",
    "sqlalchemy",
    "stargazer",
    "statsmodels",
    "tabulate",
    "textual>=8.0.2",
    "uvicorn>=0.41.0",
]


[project.optional-dependencies]
geo = [
    "geopandas",
    "geoplot",
    "shapely",
    "folium",
]

[tool.uv.sources]
pyedgar = { path = "../../../Programming/Python/pyedgar", editable = true }
reslib = { path = "../../../Programming/Python/reslib", editable = true }
