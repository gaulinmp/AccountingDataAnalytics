  - { number: 1020, date: "9/5/2024", period: 9, id: "Automated", manual: "No", location: "SB", amount: "15,000.00" }
  - { number: 1021, date: "10/5/2024", period: 10, id: "BeanCounter25", manual: "Yes", location: "SB", amount: "15,000.00" }
  - { number: 1022, date: "11/5/2024", period: 11, id: "Bob2", manual: "Yes", location: "SB", amount: "15,000.00" }
  - { number: 1023, date: "12/5/2024", period: 12, id: "CFO2", manual: "Yes", location: "SB", amount: "15,000.00" }
  - { number: 1024, date: "1/15/2024", period: 1, id: "BeanCounter25", manual: "Yes", location: "HO", amount: "5,000.00" }
  - { number: 1025, date: "2/15/2024", period: 2, id: "Automated", manual: "No", location: "HO", amount: "5,000.00" }
