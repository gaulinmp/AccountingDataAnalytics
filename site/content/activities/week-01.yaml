week: week-01
title: "Thirty Rows"
lede: "Before you know a single function, your accounting eye already works. Prove it."
prompt: >-
  Below is the rent expense detail you will open in Lab 1 — all 30 rows of it.
  Click any row you would want to ask a question about. No formulas, no tools,
  no right answer yet. Just read it the way an accountant reads it.
source: >-
  The Lab 1 extract, `JEA Detail.txt`. Every row is the same account
  (9504 Rent Expense), the same category (SG&A), and the same description
  ("Rent"), so those three columns are hidden here — the file itself still has them.

idKey: number
columns:
  - { key: number, label: "JE #", align: right, mono: true }
  - { key: date, label: "Date", mono: true }
  - { key: period, label: "Period", align: right, mono: true }
  - { key: id, label: "Posted by" }
  - { key: manual, label: "Manual" }
  - { key: location, label: "Loc" }
  - { key: amount, label: "Amount", align: right, mono: true }

rows:
  - { number: 1000, date: "9/11/2024", period: 9, id: "Laura4", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1001, date: "8/11/2024", period: 8, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
  - { number: 1002, date: "7/11/2024", period: 7, id: "BeanCounter25", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1003, date: "6/11/2024", period: 6, id: "BeanCounter25", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1004, date: "5/11/2024", period: 5, id: "BeanCounter25", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1005, date: "4/11/2024", period: 4, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
  - { number: 1006, date: "3/11/2024", period: 3, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
  - { number: 1007, date: "2/11/2024", period: 2, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
  - { number: 1008, date: "1/11/2024", period: 1, id: "Laura4", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1009, date: "10/11/2024", period: 10, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
  - { number: 1010, date: "11/11/2024", period: 11, id: "BeanCounter25", manual: "Yes", location: "LA", amount: "50,000.00" }
  - { number: 1011, date: "12/11/2024", period: 12, id: "Automated", manual: "No", location: "LA", amount: "50,000.00" }
