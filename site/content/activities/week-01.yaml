reveals:
  - id: cfo-manual
    kind: finding
    title: "The CFO hand-keyed the rent"
    rows: [1023, 1028, 1035]
    body: >-
      Rent is the most predictable entry a company posts — same amount, same day,
      every month, and the system posts 34 of these 72 rows by itself. So why is
      `CFO2` typing three of them by hand? Two of the three land in period 12: the
      last close of the year, the period where management override lives. Nothing
      here proves anything wrong. But it is exactly the question an auditor is paid
      to ask, and you asked it without running a single query.

  - id: laura-format
    kind: finding
    title: "One person's numbers are a different shape"
    rows: [1000, 1008, 1038, 1041, 1047, 1051, 1064, 1065]
    body: >-
      Sixty-four amounts are written `"50,000.00"` — quoted, comma-grouped, two
      decimals. Eight are written `50000`. Sort by Amount and those eight break
      away as their own block instead of filing in by value, because a machine
      reads them as a different *type* — the same thing Excel does to a mixed
      column, and the fastest way to see the problem. Then sort by Posted by and
      the split turns out to be total: every bare number is `Laura4`, and every
      one of Laura4's eight entries is bare. The values agree with everyone
      else's; only the *shape* differs.
      That is the fingerprint of a different route into the ledger — a different
      screen, an import, a paste from somewhere else. Worth knowing before you
      trust the column, and invisible until you look at who posted.

  - id: kayla-once
    kind: finding
    title: "Who is Kayla?"
    rows: [1033]
    body: >-
      Every person's ID here ends in a number — `Laura4`, `Bob2`, `CFO2`,
      `Karen15`, `BeanCounter25` — and the system posts under `AUTOMATED`.
      `Kayla` fits neither pattern: no digits, not the system account. She appears
      exactly once, hand-keys an October rent entry, and is never seen again. A
      naming convention that holds 71 times and breaks once is not a style
      question — it usually means the account was provisioned outside the normal
      process. One row, one question, and you can only see it by reading the
      column instead of scrolling past it.

  - id: manual-share
    kind: finding
    scored: false
    title: "Half of an automated process isn't automated"
    rows: [1000, 1002, 1003, 1004, 1008, 1010, 1015, 1016, 1017, 1018, 1021, 1022,
           1023, 1024, 1028, 1033, 1034, 1035, 1036, 1038, 1039, 1040, 1041, 1042,
           1043, 1046, 1047, 1051, 1052, 1053, 1054, 1055, 1057, 1058, 1060, 1064,
           1065, 1071]
    body: >-
      Thirty-eight of seventy-two postings are manual — on a recurring entry that
      should be untouched by human hands. Six people are involved: `BeanCounter25`
      thirteen times, `Bob2` and `Laura4` eight each, `Karen15` five, `CFO2` three,
      `Kayla` once. A 53% manual rate on rent is not fraud; it is usually a broken
      control, a bad interface, or a template nobody fixed. It is still the first
      thing you would put in the memo.

  - id: amount-is-text
    kind: finding
    columns: [amount]
    title: "Those amounts are not numbers"
    body: >-
      Most amounts are written `"50,000.00"` — wrapped in quotes, with a comma
      inside — and eight are written `50000`. Excel and Python each decide for
      themselves what a column like that means, and neither asks you. In pandas
      the column loads as text, so summing it returns
      `' "5,000.00" "1,000.00" "15,000.00" 50000…'` — all 72 values glued end to
      end, 780 characters long, no error, no warning, and no total. You could not
      have flagged this by clicking a row: some problems live in the column, not
      the record.

  - id: padded-fields
    kind: finding
    columns: [number, date, period, id, manual, location, amount]
    title: "Every cell is padded — including the column names"
    body: >-
      The table above is shown trimmed, because this one is invisible by nature.
      In the file, `Location` is not `LA`, it is `' LA      '`, padded to a fixed
      width — and so is every other field *and every header*. The column is not
      named `Amount`, it is named `' Amount'`. Type the obvious thing in Lab 1 and
      pandas raises `KeyError: 'Amount'` before you compute anything at all. Excel
      is worse, because it says nothing: it shows you `LA` and quietly answers
      FALSE to `=A2="LA"`. Nothing about this *looks* wrong, which is why
      `.str.strip()` is the first thing you will do to this file.

  - id: date-ambiguity
    kind: finding
    columns: [date, period]
    title: "Is 01/02/2024 January 2nd or the 1st of February?"
    body: >-
      Read the dates alone and you cannot tell — 48 of these 72 rows land on a
      different day under the other convention, and a machine set that way will
      parse every one of them without complaint and hand you a different year. The
      zero-padding makes the column look tidy and settles nothing. The Period
      column is what settles it: JE 1048 is period 1, so 01/02/2024 is January 2nd
      and the file is M/D/YYYY. Two columns, cross-footed, resolve what one column
      could not. That is professional skepticism doing real work.

  - id: checks-that-pass
    kind: clean
    columns: [number, manual]
    title: "And three checks that pass"
    body: >-
      JE numbers run 1000 to 1071 with no gaps and no duplicates. There is exactly
      one rent entry per location per period — six locations, twelve months,
      seventy-two rows, nothing missing and nothing posted twice. And the Manual
      flag never contradicts the user: every `AUTOMATED` row says No, every human
      row says Yes. Say so out loud. An analyst who only ever reports problems is
      as useless as one who never finds any, and knowing which checks came back
      clean is half of what makes the memo credible.

closer: >-
  Everything you just found came from knowing how accounting works — not from
  Excel, not from Python, not from AI. That is the whole argument for this course:
  the tools are learnable in a semester, and the judgment about *what to ask* is
  what you already brought with you. Lab 1 opens this same file in two of those
  tools. Now you know what to look for once it's open.
