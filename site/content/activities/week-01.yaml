  - { number: 1016, date: "5/5/2024", period: 5, id: "BeanCounter25", manual: "Yes", location: "SB", amount: "15,000.00" }
  - { number: 1017, date: "6/5/2024", period: 6, id: "Bob2", manual: "Yes", location: "SB", amount: "15,000.00" }
