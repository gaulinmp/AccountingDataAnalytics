week: week-01
title: "Seventy-Two Rows"
lede: "Before you know a single function, your accounting eye already works. Prove it."
prompt: >-
  Below is the complete 2024 rent expense detail you will open in Lab 1 — six
  locations, twelve months, every row. Click any row you would want to ask a
  question about. No formulas, no tools, no right answer yet. Just read it the
  way an accountant reads it. Sorting a column by its header is fair game.
source: >-
  The Lab 1 extract, `JEA Detail.txt`. Every row is the same account
  (9504 Rent Expense), the same category (SG&A), and the same description
  ("Rent"), so those three columns are hidden here. Values are shown trimmed —
  in the file itself every field is padded out with spaces, which turns out to
  matter (see the findings).

idKey: number
# Values are reproduced from the tab-separated file, including the export's
# literal quote characters — `"50,000.00"` really is written that way, and the
# rows that *aren't* written that way are the point of one of the findings. The
# only thing normalized here is the surrounding space padding, which HTML cannot
# render meaningfully; the padding reveal covers it in words instead.
columns:
  - { key: number, label: "JE #", align: right, mono: true, sort: number }
  - { key: date, label: "Date", mono: true, sort: date }
  - { key: period, label: "Period", align: right, mono: true, sort: number }
  - { key: id, label: "Posted by", sort: text }
  - { key: manual, label: "Manual", sort: text }
  - { key: location, label: "Loc", sort: text }
  - { key: amount, label: "Amount", align: right, mono: true, sort: number }

